
name: Keep Streamlit App Alive

on:
  schedule:
    - cron: "0 */4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping-app:
    runs-on: ubuntu-latest
    steps:
      - name: Check Streamlit homepage
        run: |
          APP="https://mccef-interactive-web-site.streamlit.app/"

          echo "Requesting: $APP"

          curl --location --max-redirs 5 \
            --silent --show-error \
            --max-time 60 \
            --output /dev/null \
            --write-out "\nFinal URL: %{url_effective}\nHTTP status: %{http_code}\n" \
            "$APP"


